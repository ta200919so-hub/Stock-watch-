name: Zero-cost hourly maintenance
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zero-cost-maintenance
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check api/search.js
          node --check api/history.js
      - name: Regression tests
        run: node --test tests/*.test.mjs
      - name: Security and portfolio data safeguards
        run: |
          node -e 'const fs=require("fs");const app=fs.readFileSync("app.js","utf8");if(!app.includes("stock-watch-ai-v1")||!app.includes("stock-watch-ai-backup-v1"))process.exit(1)'
      - name: Cost policy
        run: |
          echo "No paid AI API calls, no paid AI credentials, no self-hosted or larger runners."
          echo "AI code generation is disabled under the monthly 0 JPY budget."
