name: Hourly AI development
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: hourly-ai-development
  cancel-in-progress: false
jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require AI credential
        if: env.OPENAI_API_KEY == ''
        run: |
          echo "::error::Add OPENAI_API_KEY in repository Actions secrets to activate the autonomous developer."
          exit 1
      - name: Skip when an AI PR is already open
        id: existing
        run: |
          if gh pr list --state open --json headRefName --jq '.[].headRefName' | grep -q '^ai/hourly-'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Codex CLI
        if: steps.existing.outputs.skip == 'false'
        run: npm install --global @openai/codex
      - name: Generate one focused improvement
        if: steps.existing.outputs.skip == 'false'
        run: |
          codex exec --sandbox workspace-write --skip-git-repo-check "$(cat .github/ai-developer-prompt.md)"
      - name: Restrict modifications to application and test files
        if: steps.existing.outputs.skip == 'false'
        run: |
          python3 - <<'PY'
          import subprocess,sys
          allowed={"app.js","index.html","style.css","sw.js","manifest.webmanifest","icon.svg"}
          files=subprocess.check_output(["git","status","--porcelain","--untracked-files=all"],text=True).splitlines()
          changed=[line[3:] for line in files]
          invalid=[p for p in changed if not (p in allowed or p.startswith("api/") or p.startswith("tests/"))]
          if invalid:
              print("Unexpected files:",invalid,file=sys.stderr)
              sys.exit(1)
          PY
      - name: Run syntax and regression tests
        if: steps.existing.outputs.skip == 'false'
        run: |
          node --check app.js
          node --check sw.js
          node --check api/search.js
          node --check api/history.js
          node --test tests/*.test.mjs
      - name: Create improvement PR
        if: steps.existing.outputs.skip == 'false'
        run: |
          git add -- app.js index.html style.css sw.js manifest.webmanifest icon.svg api tests
          if git diff --cached --quiet; then
            echo "No safe changes generated."
            exit 0
          fi
          BRANCH="ai/hourly-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "AI: focused incremental improvement"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "AI: hourly incremental improvement" --body "Generated by the scheduled AI developer. Merge only after all required checks pass. Do not remove branch protection."
          gh pr merge "$BRANCH" --auto --squash --delete-branch || echo "::warning::Auto-merge unavailable. PR remains open for review or configuration."
