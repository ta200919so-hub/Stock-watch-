name: Stock Watch AI checks
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check api/search.js
          node --check api/history.js
          node --check sw.js
      - name: Regression tests
        run: node --test tests/*.test.mjs
      - name: Install Chromium browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Mobile browser integration
        run: node --test tests/mobile-browser.browser.mjs
      - name: Upload mobile viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-viewport-screenshots
          path: tests/screenshots/*.png
          if-no-files-found: ignore
