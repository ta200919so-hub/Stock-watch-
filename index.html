<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Stock Watch AI" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css?v=2" />
  <title>Stock Watch AI</title>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <p class="eyebrow">MY STOCK PORTFOLIO</p>
        <h1>Stock Watch <span>AI</span></h1>
        <p class="muted">日本株・米国株を円でまとめて管理</p>
      </div>
      <button id="refreshBtn" class="icon-btn" aria-label="株価を更新">↻</button>
    </header>

    <section class="summary">
      <div class="metric"><span>投資総額</span><strong id="totalCost">¥0</strong></div>
      <div class="metric"><span>現在評価額</span><strong id="totalValue">¥0</strong></div>
      <div class="metric"><span>トータル損益</span><strong id="totalPnl">¥0</strong><small id="totalPnlPct">—</small></div>
    </section>

    <section class="toolbar">
      <button class="filter active" data-filter="ALL">すべて</button>
      <button class="filter" data-filter="JP">🇯🇵 日本</button>
      <button class="filter" data-filter="US">🇺🇸 米国</button>
    </section>

    <div id="status" class="status" hidden></div>
    <section id="list" class="list"></section>
    <button id="openAdd" class="fab">＋ 保有銘柄を追加</button>

    <section class="notice">
      <strong>株価・AI見通しについて</strong>
      <p>株価は公開マーケットデータから取得し、米国株はUSD/JPYで円換算します。取得元の都合で遅延・停止する場合があります。AI見通しは値動きベースの簡易コメントで、投資助言ではありません。</p>
    </section>
  </main>

  <dialog id="addDialog">
    <form id="addForm">
      <div class="dialog-head">
        <h2>保有銘柄を追加</h2>
        <button type="button" id="closeAdd" class="icon-btn">×</button>
      </div>
      <label>市場
        <select id="market"><option value="JP">🇯🇵 日本株</option><option value="US">🇺🇸 米国株</option></select>
      </label>
      <label>銘柄名
        <input id="name" required autocomplete="off" placeholder="例：味の素 / NVIDIA" />
        <div id="suggestions" class="suggestions" hidden></div>
      </label>
      <input id="symbol" type="hidden" />
      <div id="selectedStock" class="selected-stock" hidden></div>
      <label>買った時の1株価格（円）
        <input id="purchasePrice" type="number" min="0.01" step="0.01" required inputmode="decimal" placeholder="例：6200" />
      </label>
      <label>保有株数
        <input id="shares" type="number" min="0.0001" step="0.0001" required inputmode="decimal" placeholder="例：10" />
      </label>
      <label>メモ（任意）<input id="memo" placeholder="買った理由など" /></label>
      <button class="primary" type="submit">ポートフォリオに追加</button>
      <p class="form-help">証券コード・ティッカーは入力不要です。銘柄名を検索して候補から選んでください。</p>
    </form>
  </dialog>

  <script src="app.js?v=2"></script>
</body>
</html>
